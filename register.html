<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 弈勇 AI 资源站</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">弈</span>
        <span class="brand-name">弈勇 AI 资源站</span>
      </div>

      <h1>会员免费注册</h1>
      <p class="sub">使用电子邮箱免费注册会员。提交后需等待管理员后台审核，通过后才能登录。</p>

      <form id="registerForm" novalidate>
        <label for="displayName">昵称（可选）</label>
        <input id="displayName" name="displayName" type="text"
               autocomplete="nickname" placeholder="方便管理员识别你" maxlength="30">

        <label for="email">电子邮箱</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="随便填，如 123456@qq.com（无需真实邮箱）" required>

        <label for="password">密码</label>
        <input id="password" name="password" type="password"
               autocomplete="new-password" placeholder="至少 6 位" required minlength="6">

        <label for="password2">确认密码</label>
        <input id="password2" name="password2" type="password"
               autocomplete="new-password" placeholder="再次输入密码" required>

        <button class="btn" id="submitBtn" type="submit">注册</button>
      </form>

      <div class="msg" id="msg"></div>

      <div class="switch">
        已有账号？<a href="login.html">去登录</a>
      </div>
      <div style="text-align:center">
        <a class="back-home" href="index.html">← 返回首页</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    'use strict';
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg show ' + (type || 'error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const displayName = document.getElementById('displayName').value;

      if (!email) return showMsg('请填写邮箱。', 'error');
      if (password.length < 6) return showMsg('密码至少需要 6 位。', 'error');
      if (password !== password2) return showMsg('两次输入的密码不一致。', 'error');

      btn.disabled = true;
      btn.textContent = '注册中…';
      showMsg('', 'error');

      try {
        const { data, error } = await AUTH.signUp(email, password, displayName);
        if (error) {
          if (/already registered/i.test(error.message)) {
            showMsg('该邮箱已注册，可直接去登录。', 'error');
          } else if (/invalid format|invalid email/i.test(error.message)) {
            showMsg('邮箱格式不正确：请填写类似 123456@qq.com 的格式（不需要真实邮箱）。', 'error');
          } else {
            showMsg(error.message, 'error');
          }
          return;
        }

        // 已关闭邮箱确认：注册即成功，退出登录让用户走正常登录流程
        if (data.session) {
          await AUTH.signOut();
        }
        showMsg('注册成功！你的账号已提交，等待管理员审核，通过后即可登录。', 'ok');

        btn.disabled = false;
        btn.textContent = '注册';
        form.reset();
        setTimeout(() => { location.href = 'login.html'; }, 1800);
      } catch (err) {
        showMsg('发生错误：' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    });
  </script>
</body>
</html>
